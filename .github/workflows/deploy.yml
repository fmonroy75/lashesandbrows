name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # IMPORTANT:
      # Do not use npm ci here because npm is skipping
      # the platform-specific optional native packages.
      - name: Install dependencies
        run: npm install --include=optional
        env:
          NPM_CONFIG_INCLUDE: optional
          npm_config_optional: true

      - name: Install Linux native bindings
        run: |
          npm install --no-save --include=optional \
            @rolldown/binding-linux-x64-gnu@1.2.6 \
            @rollup/rollup-linux-x64-gnu \
            lightningcss

      - name: Verify native bindings
        run: |
          echo "=== Rolldown ==="
          npm ls @rolldown/binding-linux-x64-gnu || true

          echo "=== Rollup ==="
          npm ls @rollup/rollup-linux-x64-gnu || true

          echo "=== LightningCSS ==="
          npm ls lightningcss || true

          echo "=== Rolldown files ==="
          ls -la node_modules/@rolldown/ || true

          echo "=== LightningCSS files ==="
          ls -la node_modules/lightningcss/ || true

      - name: Generate Nuxt site
        run: npm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  env:
    NUXT_APP_BASE_URL: /lashesandbrows/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
