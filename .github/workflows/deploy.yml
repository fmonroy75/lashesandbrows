name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --include=optional --force

      - name: Install Linux native packages
        run: |
          npm install --no-save --include=optional \
            @rolldown/binding-linux-x64-gnu@1.2.6 \
            @rollup/rollup-linux-x64-gnu

      - name: Verify Rolldown binding
        run: |
          echo "Checking Rolldown..."
          test -f node_modules/@rolldown/binding-linux-x64-gnu/rolldown-binding.linux-x64-gnu.node
          echo "Rolldown Linux binding OK"

      - name: Verify Rollup binding
        run: |
          echo "Checking Rollup..."
          test -f node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
          echo "Rollup Linux binding OK"

      - name: Generate Nuxt site
        run: npm run generate

      - name: Verify generated site
        run: |
          test -f .output/public/index.html
          echo "Nuxt static site generated successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
