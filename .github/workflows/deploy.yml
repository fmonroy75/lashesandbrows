name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --include=optional
        env:
          NPM_CONFIG_INCLUDE: optional

      - name: Verify native dependencies
        run: |
          echo "Checking Rollup..."
          npm ls @rollup/rollup-linux-x64-gnu || true

          echo "Checking Rolldown..."
          npm ls @rolldown/binding-linux-x64-gnu || true

          echo "Checking LightningCSS..."
          npm ls lightningcss || true

          echo "Checking LightningCSS Linux binding..."
          ls -la node_modules/lightningcss/ || true

      - name: Generate Nuxt site
        run: npm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
